<div class="properties-page animate-fade-in">
  <div class="page-header">
    <div>
      <h1>Property Inventory</h1>
      <p class="sub-desc">Browse, manage, and share verified listings with prospective buyers.</p>
    </div>

    <button class="ef-btn ef-btn-primary" (click)="openAddModal.set(true)">
      <span>+ Add New Property</span>
    </button>
  </div>

  <!-- Filter Controls Bar -->
  <div class="filter-bar">
    <div class="search-input-wrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" [(ngModel)]="searchQuery" placeholder="Search by locality, title, or BHK...">
    </div>

    <div class="type-filter-chips">
      <button
        class="filter-chip"
        [class.active]="selectedType() === 'all'"
        (click)="selectedType.set('all')">
        All ({{ propertyService.tenantProperties().length }})
      </button>
      <button
        class="filter-chip"
        [class.active]="selectedType() === 'apartment'"
        (click)="selectedType.set('apartment')">
        Apartments
      </button>
      <button
        class="filter-chip"
        [class.active]="selectedType() === 'villa'"
        (click)="selectedType.set('villa')">
        Villas
      </button>
      <button
        class="filter-chip"
        [class.active]="selectedType() === 'plot'"
        (click)="selectedType.set('plot')">
        Plots & Land
      </button>
      <button
        class="filter-chip"
        [class.active]="selectedType() === 'commercial'"
        (click)="selectedType.set('commercial')">
        Commercial
      </button>
    </div>
  </div>

  <!-- Properties Grid -->
  <div class="properties-grid" *ngIf="filteredProperties().length > 0">
    <app-property-card
      *ngFor="let prop of filteredProperties()"
      [property]="prop"
      (onSelect)="selectedProperty.set($event)"
      (onEdit)="startEditProperty($event)"
      (onDelete)="deleteProperty($event)">
    </app-property-card>
  </div>

  <div class="empty-state" *ngIf="filteredProperties().length === 0">
    <p>No properties match your active filter.</p>
    <button class="ef-btn ef-btn-outlined ef-btn-sm" (click)="selectedType.set('all'); searchQuery = ''">
      Reset Filters
    </button>
  </div>

  <!-- Add Property Modal -->
  <div class="modal-backdrop" *ngIf="openAddModal()" (click)="openAddModal.set(false)">
    <div class="modal-card animate-fade-in" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2>Ingest New Property Listing</h2>
        <button class="close-btn" (click)="openAddModal.set(false)">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="ef-form-group col-span-2">
            <label>Property Title</label>
            <input type="text" [(ngModel)]="newProp.title" placeholder="e.g. 3BHK Lake-View Apartment in Adyar">
          </div>
          <div class="ef-form-group">
            <label>Property Type</label>
            <select [(ngModel)]="newProp.propertyType">
              <option value="apartment">Apartment</option>
              <option value="villa">Independent Villa</option>
              <option value="plot">Residential Plot</option>
              <option value="commercial">Commercial Office</option>
            </select>
          </div>
          <div class="ef-form-group">
            <label>Listing Type</label>
            <select [(ngModel)]="newProp.listingType">
              <option value="sale">Outright Sale</option>
              <option value="rent">Rental / Lease</option>
            </select>
          </div>
          <div class="ef-form-group">
            <label>Price (₹)</label>
            <input type="number" [(ngModel)]="newProp.price" placeholder="e.g. 15000000">
          </div>
          <div class="ef-form-group">
            <label>Super Built-up Area (Sq.ft)</label>
            <input type="number" [(ngModel)]="newProp.area" placeholder="e.g. 1850">
          </div>
          <div class="ef-form-group">
            <label>Locality</label>
            <input type="text" [(ngModel)]="newProp.locality" placeholder="e.g. Adyar">
          </div>
          <div class="ef-form-group">
            <label>City</label>
            <input type="text" [(ngModel)]="newProp.city" placeholder="e.g. Chennai">
          </div>
          <div class="ef-form-group col-span-2">
            <label>Owner Details (Confidential & Private to Agency)</label>
            <input type="text" [(ngModel)]="newProp.ownerName" placeholder="Owner Name">
            <input type="text" [(ngModel)]="newProp.ownerPhone" placeholder="Owner Phone" style="margin-top: 6px;">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="ef-btn ef-btn-outlined" (click)="openAddModal.set(false)">Cancel</button>
        <button class="ef-btn ef-btn-primary" (click)="saveProperty()">Publish Listing</button>
      </div>
    </div>
  </div>

  <!-- Edit Property Modal -->
  <div class="modal-backdrop" *ngIf="editingProperty()" (click)="editingProperty.set(null)">
    <div class="modal-card animate-fade-in" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2>Edit Property Listing</h2>
        <button class="close-btn" (click)="editingProperty.set(null)">&times;</button>
      </div>
      <div class="modal-body" *ngIf="editingProperty()">
        <div class="form-grid">
          <div class="ef-form-group col-span-2">
            <label>Property Title</label>
            <input type="text" [(ngModel)]="editForm.title">
          </div>
          <div class="ef-form-group">
            <label>Status</label>
            <select [(ngModel)]="editForm.status">
              <option value="available">Available</option>
              <option value="under_offer">Under Offer</option>
              <option value="sold">Sold</option>
              <option value="rented">Rented</option>
            </select>
          </div>
          <div class="ef-form-group">
            <label>Price (₹)</label>
            <input type="number" [(ngModel)]="editForm.price">
          </div>
          <div class="ef-form-group">
            <label>Area (Sq.ft)</label>
            <input type="number" [(ngModel)]="editForm.area">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="ef-btn ef-btn-outlined" (click)="editingProperty.set(null)">Cancel</button>
        <button class="ef-btn ef-btn-primary" (click)="saveEditProperty()">Update Property</button>
      </div>
    </div>
  </div>
</div>
