<div
  *ngIf="snackbarService.currentSnackbar() as toast"
  class="ef-snackbar-host"
  role="status"
  aria-live="polite">
  <div class="ef-snackbar-card" [ngClass]="'type-' + toast.type">
    <!-- Semantic Indicator Dot / Bar -->
    <div class="semantic-indicator" aria-hidden="true"></div>

    <!-- Message Body -->
    <div class="ef-snackbar-message">
      {{ toast.message }}
    </div>

    <!-- Optional Action Button -->
    <button
      *ngIf="toast.actionLabel"
      type="button"
      class="ef-snackbar-action"
      (click)="handleAction()">
      {{ toast.actionLabel }}
    </button>

    <!-- Dismiss Button -->
    <button
      type="button"
      class="ef-snackbar-close"
      (click)="snackbarService.dismiss()"
      aria-label="Dismiss notification">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>
</div>
