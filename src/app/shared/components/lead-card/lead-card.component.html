<div class="lead-card animate-fade-in" (click)="onOpenMatcher.emit(lead)">
  <div class="lead-card-top">
    <span class="priority-pill" [ngClass]="lead.priority">{{ lead.priority | uppercase }}</span>
    <span class="source-tag">{{ lead.source }}</span>
  </div>

  <h4 class="lead-name">{{ lead.name }}</h4>
  <p class="lead-phone">{{ lead.phone }}</p>

  <div class="lead-req-box">
    <span class="req-type">{{ lead.requirement.propertyTypes.join(', ') }}</span>
    <span class="req-budget">{{ lead.requirement.budgetMin | currencyFormat }} - {{ lead.requirement.budgetMax | currencyFormat }}</span>
  </div>

  <!-- Quick Action Rows (Balanced 2-Tier Layout) -->
  <div class="lead-actions" (click)="$event.stopPropagation()">
    <!-- Row 1: Primary Communication & Matching -->
    <div class="actions-group primary-row">
      <a [href]="'tel:' + lead.phone" class="action-btn call" title="Call Prospect">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
        </svg>
        <span>Call</span>
      </a>

      <a [href]="leadService.getWhatsAppShareUrl(lead)" target="_blank" class="action-btn wa" title="Chat on WhatsApp">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
        </svg>
        <span>WhatsApp</span>
      </a>

      <button class="action-btn match" (click)="onOpenMatcher.emit(lead)" title="Smart Inventory Matcher">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="12" cy="12" r="10"></circle>
          <circle cx="12" cy="12" r="6"></circle>
          <circle cx="12" cy="12" r="2"></circle>
        </svg>
        <span>Match</span>
      </button>
    </div>

    <!-- Row 2: Management & Status -->
    <div class="actions-group secondary-row">
      <button
        class="action-btn won"
        *ngIf="lead.stage !== 'closed_won'"
        (click)="onMarkWon.emit(lead)"
        title="Mark as Closed Won">
        <span>✓ Won</span>
      </button>

      <button class="action-btn edit-lead-btn" (click)="onEdit.emit(lead)" title="Edit Lead Details">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
        </svg>
        <span>Edit</span>
      </button>

      <button class="action-btn delete-lead-btn" (click)="onDelete.emit(lead)" title="Delete Lead">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        <span>Delete</span>
      </button>
    </div>
  </div>
</div>
