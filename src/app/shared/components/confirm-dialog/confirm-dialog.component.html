<div class="modal-backdrop animate-fade-in" *ngIf="isOpen" (click)="onBackdropClick($event)">
  <div class="confirm-modal-card animate-scale-up" (click)="$event.stopPropagation()">
    <!-- Icon Header Badge -->
    <div class="confirm-icon-wrapper" [ngClass]="variant">
      <!-- Danger / Trash Icon -->
      <svg *ngIf="variant === 'danger' || icon === 'trash' || icon === 'danger'" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        <line x1="10" y1="11" x2="10" y2="17"></line>
        <line x1="14" y1="11" x2="14" y2="17"></line>
      </svg>

      <!-- Warning / Alert Icon -->
      <svg *ngIf="variant === 'warning' || icon === 'warning'" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
        <line x1="12" y1="9" x2="12" y2="13"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>

      <!-- Success / Check Icon -->
      <svg *ngIf="variant === 'success' || icon === 'success'" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>

      <!-- Swap / Plan / Primary Info Icon -->
      <svg *ngIf="variant === 'primary' && icon !== 'success' && icon !== 'danger' && icon !== 'warning'" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
    </div>

    <!-- Content -->
    <div class="confirm-content">
      <h3 class="confirm-title">{{ title }}</h3>
      <p class="confirm-message" [innerHTML]="message"></p>
    </div>

    <!-- Actions -->
    <div class="confirm-actions">
      <button type="button" class="ef-btn ef-btn-outlined btn-cancel" (click)="cancel.emit()">
        {{ cancelText }}
      </button>

      <button
        type="button"
        class="ef-btn btn-confirm"
        [ngClass]="'btn-' + variant"
        (click)="confirm.emit()">
        {{ confirmText }}
      </button>
    </div>
  </div>
</div>
