<header class="app-navbar">
  <div class="navbar-left">
    <button class="menu-toggle-btn" (click)="onToggleSidebar.emit()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <div class="brand-title">
      <span class="brand-name">{{ platformConfig.platformName() }}</span>
      <span class="brand-tag">PRO</span>
    </div>
  </div>

  <div class="navbar-center">
    <div class="global-search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" placeholder="Search properties, leads, localities, deals...">
    </div>
  </div>

  <div class="navbar-right">
    <!-- Active Tenant Badge -->
    <div class="tenant-badge" title="Active Agency Organization Context">
      <span class="dot"></span>
      <span class="tenant-name">{{ tenantService.activeTenant().agencyName }}</span>
    </div>

    <!-- Super Admin Indicator Pill -->
    <div class="super-pill" *ngIf="auth.isSuperAdmin()">
      <span>SUPER ADMIN</span>
    </div>

    <!-- User Profile Avatar with Clickable Dropdown Menu -->
    <div class="user-profile-menu-container">
      <div class="user-avatar-btn" (click)="showUserMenu.set(!showUserMenu())">
        <div class="avatar-circle">{{ userInitials }}</div>
      </div>

      <div class="user-dropdown-menu animate-fade-in" *ngIf="showUserMenu()">
        <div class="dropdown-header">
          <strong>{{ auth.currentUser()?.displayName }}</strong>
          <span class="email-sub">{{ auth.currentUser()?.email }}</span>
          <span class="role-pill">{{ (auth.currentUser()?.role || 'agent') | uppercase }}</span>
        </div>

        <div class="dropdown-divider"></div>

        <button class="menu-item-btn logout" (click)="logout()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Sign Out</span>
        </button>
      </div>
    </div>
  </div>
</header>
