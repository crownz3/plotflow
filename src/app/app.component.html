<!-- When Not Authenticated OR in Onboarding / Pending Approval: Render Clean Standalone View -->
<div class="auth-only-wrapper" *ngIf="!isFullAppShell()">
  <router-outlet></router-outlet>
</div>

<!-- When Authenticated & Active: Render Full PlotFlow Application Shell -->
<div class="app-container" *ngIf="isFullAppShell()">
  <!-- Super Admin Active Tenant Inspection Banner -->
  <div class="support-context-banner" *ngIf="auth.isSupportContext()">
    <div class="banner-content">
      
      <span>Super Admin Inspection Mode: Active Tenant <strong>{{ tenantService.activeTenant().agencyName }}</strong> ({{ auth.activeTenantId() }})</span>
    </div>
    <button class="exit-banner-btn" (click)="exitSupportContext()">
      Return to Super Admin Console &times;
    </button>
  </div>

  <!-- Top Navigation Bar -->
  <app-navbar (onToggleSidebar)="toggleSidebar()"></app-navbar>

  <!-- Mobile Drawer Backdrop Overlay -->
  <div
    class="mobile-drawer-backdrop"
    *ngIf="mobileDrawerOpen()"
    (click)="closeMobileDrawer()">
  </div>

  <div class="app-body">
    <!-- Navigation Drawer (Desktop Collapsible + Mobile Slide-Out Drawer) -->
    <app-sidebar
      [collapsed]="sidebarCollapsed"
      [mobileOpen]="mobileDrawerOpen()"
      (onNavigate)="closeMobileDrawer()">
    </app-sidebar>

    <!-- Main Dynamic Workspace View -->
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Mobile Floating Action Button (FAB) to Open Menu -->
  <button
    type="button"
    class="mobile-menu-fab"
    [class.active]="mobileDrawerOpen()"
    (click)="toggleMobileDrawer()"
    aria-label="Toggle Navigation Menu"
    title="Navigation Menu">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" *ngIf="!mobileDrawerOpen()">
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" *ngIf="mobileDrawerOpen()">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>
</div>

<!-- Global Full-Screen Major Action Loader -->
<app-loader></app-loader>

<!-- Global Responsive Snackbar / Toast Notification System -->
<app-snackbar></app-snackbar>

<!-- Contextual 'Do You Want To Use AI?' Interactive Assistance Dialog -->
<app-ai-prompt-dialog></app-ai-prompt-dialog>
